version: '3.8'

services:
  web:
    build: .
    container_name: netcoreai
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netcoreai.rule=Host(`netcoreai.tech`) || Host(`www.netcoreai.tech`)"
      - "traefik.http.routers.netcoreai.entrypoints=websecure"
      - "traefik.http.routers.netcoreai.tls.certresolver=letsencrypt"
      - "traefik.http.services.netcoreai.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.netcoreai-www-redirect.redirectregex.regex=^https://www\\.netcoreai\\.tech/(.*)"
      - "traefik.http.middlewares.netcoreai-www-redirect.redirectregex.replacement=https://netcoreai.tech/$${1}"
      - "traefik.http.middlewares.netcoreai-www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.netcoreai.middlewares=netcoreai-www-redirect"

networks:
  traefik:
    external: true
